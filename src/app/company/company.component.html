<app-card>
  <button [class.active]="selected" (click)="onSelectCompany()">
    <img [src]="imagePath" [alt]="company.name" />
    <div class="company-info">
      <span class="company-name">{{ company.name }}</span>
      <span class="company-duration">{{ company.duration }}</span>
    </div>
  </button>
</app-card>

<app-header />

<app-skills />

<main id="workhistory" class="main-layout">
  <!-- Company list / sidebar -->
  <aside class="company-list-container">
    <ul id="company" class="company-list">
      @for (company of companies; track company.id) {
        <li>
          <app-company
            [company]="company"
            [selected]="company.id === selectedCompanyId"
            (select)="onSelectCompany($event)"
          />
        </li>
      }
    </ul>
  </aside>

  <!-- Projects / main content -->
  <section id="projects" class="projects-container">
    @if (selectedCompany) {
      <app-projects
        [duration]="selectedCompany.duration"
        [companyId]="selectedCompany.id"
        [name]="selectedCompany.name"
      />
    } @else {
      <div id="fallback">
        <span class="fallback-icon">👈</span>
        <p class="fallback-title">No company selected</p>
        <p class="fallback-hint">Select a company from the list to view assigned projects.</p>
      </div>
    }
  </section>
</main>

<app-about-me />

<app-footer />

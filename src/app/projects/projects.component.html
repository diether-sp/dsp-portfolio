<section class="projects-section">

  <!-- Company header strip -->
  <div class="company-header">
    <div class="company-header-left">
      <div class="company-header-info">
        <h2 class="company-title">{{ name }}</h2>
        <div class="company-meta">
          <span class="duration-badge">⏱ {{ duration }}</span>
          <span class="count-badge">{{ selectedCompanyProjects.length }} project{{ selectedCompanyProjects.length !== 1 ? 's' : '' }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Project cards -->
  <ul class="projects-grid">
    @for (project of selectedCompanyProjects; track project.id) {
      <li class="project-item">
        <app-project [project]="project" />
      </li>
    }
  </ul>

</section>

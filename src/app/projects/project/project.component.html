<app-card class="project-card">

  <div class="card-accent"></div>

  <article class="project-content">

    <!-- Header -->
    <header class="project-header">
      <div class="project-header-left">
        <h2 class="project-title">{{ project.title }}</h2>
        <div class="project-meta">
          <span class="meta-date">{{ project.startDate | date:'MMM yyyy' }}</span>
          <span class="meta-sep">–</span>
          <span class="meta-date">{{ project.endDate ? (project.endDate | date:'MMM yyyy') : 'Present' }}</span>
        </div>
      </div>
      <button class="primary-btn" (click)="openProjDescModal()">View Details</button>
    </header>

    <!-- Technologies -->
    <div class="project-section">
      <h4 class="section-title">🛠 Technologies</h4>
      <div class="technologies">
        <span
          class="tech-badge"
          *ngFor="let tech of project.technologies">
          {{ tech }}
        </span>
      </div>
    </div>

    <!-- Responsibilities -->
    <div class="project-section">
      <h4 class="section-title">✦ Key Responsibilities</h4>
      <ul class="responsibilities">
        <li *ngFor="let resp of project.responsibilities">
          <span class="bullet"></span>
          <span class="resp-text">{{ resp }}</span>
        </li>
      </ul>
    </div>

  </article>

</app-card>

<app-proj-desc
  [isOpen]="isProjDescModalOpen"
  [title]="project.title"
  [desc]="project.desc"
  (close)="isProjDescModalOpen = false">
</app-proj-desc>
